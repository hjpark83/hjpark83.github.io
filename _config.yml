    content:
      - layout: left
        title: 3D Synthesized Space Reconstruction using 3DGS
        link: http://www.ipiu.or.kr/
        link_text: Site
        image: images/poster_ipiu.png
        description: | # this will include new lines to allow paragraphs
          - **Title** \
            3DGS를 활용한 Point Cloud 합성 및 3차원 합성 공간 복원에 대한 연구
          - **Authors** \
            Hyunjoon Park, Donghyeon Cho (Hanyang University)
          - **Conference** \
            IPIU, 2025 (37th Workshop on Image Processing and Image Understanding)
          - **Abstract** \
            3D Gaussian Splatting (3DGS) is a novel representation for real-time rendering of 3D scenes. \
            This paper explores the potential of 3DGS in synthesizing point clouds and reconstructing 3D synthesized spaces. \
            We propose a method that utilizes 3DGS to generate high-quality point clouds from multi-view images and reconstructs the 3D space effectively. \
            Experimental results demonstrate the effectiveness of our approach in producing detailed and accurate 3D representations.

